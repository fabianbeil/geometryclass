<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geometrie-Konstruktionen</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="toolbar">
    <button data-tool="pen" class="active icon-btn" aria-label="Stift" title="Stift">
      <i data-lucide="pencil"></i>
    </button>

    <label title="Strichstärke">Strich
      <select id="thickness">
        <option value="2" selected>Fein</option>
        <option value="4">Mittel</option>
        <option value="8">Dick</option>
        <option value="14">Sehr dick</option>
      </select>
    </label>

    <div class="swatches" role="group" aria-label="Stiftfarbe">
      <button type="button" class="color-swatch standard active" data-color="standard" aria-label="Standardfarbe" title="Standardfarbe"></button>
      <button type="button" class="color-swatch" data-color="#e53935" aria-label="Rot" title="Rot"></button>
      <button type="button" class="color-swatch" data-color="#fb8c00" aria-label="Orange" title="Orange"></button>
      <button type="button" class="color-swatch" data-color="#fdd835" aria-label="Gelb" title="Gelb"></button>
      <button type="button" class="color-swatch" data-color="#43a047" aria-label="Grün" title="Grün"></button>
      <button type="button" class="color-swatch" data-color="#1e88e5" aria-label="Blau" title="Blau"></button>
      <button type="button" class="color-swatch" data-color="#8e24aa" aria-label="Lila" title="Lila"></button>
    </div>

    <select id="penColor" hidden>
      <option value="standard" selected>Standard</option>
      <option value="#e53935">Rot</option>
      <option value="#fb8c00">Orange</option>
      <option value="#fdd835">Gelb</option>
      <option value="#43a047">Grün</option>
      <option value="#1e88e5">Blau</option>
      <option value="#8e24aa">Lila</option>
    </select>

    <button data-tool="eraser" class="icon-btn" aria-label="Radierer" title="Radierer">
      <i data-lucide="eraser"></i>
    </button>

    <label title="Radiermodus">Radieren
      <select id="eraseMode">
        <option value="partial">Bereich unter Cursor</option>
        <option value="whole" selected>Ganze Linie</option>
      </select>
    </label>

    <button data-tool="pan" class="icon-btn" aria-label="Verschieben" title="Verschieben">
      <i data-lucide="hand"></i>
    </button>

    <button id="rulerButton" class="icon-btn" aria-label="Geodreieck" title="Geodreieck">
      <i data-lucide="triangle"></i>
    </button>

    <button id="compassButton" class="icon-btn" disabled aria-label="Zirkel, später" title="Zirkel (später)">
      <i data-lucide="circle"></i>
    </button>

    <button id="themeButton" class="icon-btn" aria-label="Theme wechseln" title="Theme wechseln">
      <i data-lucide="moon"></i>
    </button>

    <button id="saveButton" class="icon-btn" aria-label="Zeichnung speichern" title="Zeichnung speichern">
      <i data-lucide="save"></i>
    </button>

    <button id="loadButton" class="icon-btn" aria-label="Zeichnung laden" title="Zeichnung laden">
      <i data-lucide="folder-open"></i>
    </button>

    <input id="loadFile" type="file" accept=".json,application/json" hidden>

    <button id="clearButton" class="icon-btn" aria-label="Alles löschen" title="Alles löschen">
      <i data-lucide="trash-2"></i>
    </button>

    <span id="status">Mausrad: Zoom · Verschieben: Werkzeug oder mittlere Maustaste</span>
  </div>

  <canvas id="canvas"></canvas>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
